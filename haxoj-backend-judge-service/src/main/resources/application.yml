# 判题服务配置文件
spring:
  application:
    name: haxoj-backend-judge-service
  # 默认 dev 环境
  profiles:
    active: dev
  # session 配置
  session:
    timeout: 2592000
  # 数据库配置（默认值 = 本机开发库；换环境用 MYSQL_* 环境变量覆盖，勿改此处）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:my_db}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  # RabbitMQ（host 默认 127.0.0.1：本机安装或 SSH 隧道；连 VM 时用环境变量覆盖）
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:haxoj}
    password: ${RABBITMQ_PASSWORD:haxoj123}
    virtual-host: /
    # 生产端：确认消息是否到达交换机 / 是否无法路由到队列
    publisher-confirm-type: correlated
    publisher-returns: true
    # 消费端：手动 ack、每次只取一条
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: 1
        max-concurrency: 2
        default-requeue-rejected: false
  # 注册中心 Nacos（服务发现）
  cloud:
    nacos:
      discovery:
        # 本地 Nacos（standalone 模式），原阿里云 MSE 公网地址已不可解析
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:public}
        # 注册回环地址：与 server.address 成对，避免 Nacos 登记成局域网 IP 后 Feign 连不上
        # ⚠️ NACOS_REGISTER_IP 与 SERVER_ADDRESS 必须一起改
        ip: ${NACOS_REGISTER_IP:127.0.0.1}
    # 流量防护 Sentinel
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      eager: true
server:
  # 只监听回环：业务端口不对局域网/公网开放，外部只能经网关 8001 进来
  # 与上方 nacos.discovery.ip 必须成对改，否则 Feign/网关会连到未监听的地址
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${JUDGE_PORT:8103}
  servlet:
    context-path: /api
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 代码沙箱配置
# ⚠️ 沙箱在虚拟机上，而虚拟机 IP 会变。地址走环境变量注入，
#   不要再写死 IP —— 否则 IP 一变就得改 Java 代码重新编译。
codesandbox:
  # remote=调真实沙箱服务；example=本地假沙箱（不真执行代码，用于跳过虚拟机调试）
  type: ${SANDBOX_TYPE:remote}
  execute-url: ${SANDBOX_EXECUTE_URL:http://192.168.221.45:8080/sandbox/execute}
  auth-header: ${SANDBOX_AUTH_HEADER:auth}
  auth-secret: ${SANDBOX_AUTH_SECRET:secretKey}
